value: null

hydra:
  callbacks:
    capture_controller:
      _target_: my_app.CaptureControllerHydraCallback
      # Controller-valid: available once HydraConfig is installed for the
      # multirun controller lifecycle (before callbacks / sweeper init).
      controller_cwd: ${hydra:runtime.cwd}
  sweeper:
    params:
      # Also exercise sweeper-param resolution of a controller-valid value.
      # Prefer runtime.version over runtime.cwd here so the resulting override
      # string stays portable across Windows path separators.
      value: ${hydra:runtime.version}
